<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA Picture of the Day</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Times New Roman", serif;
      background: white;
      color: black;
      padding: 20px;
    }

    .container {
      max-width: 950px;
      margin: auto;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 34px;
    }

    /* FORM */

    #search-form {
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #search-form label {
      font-weight: bold;
      font-size: 18px;
    }

    #search-input {
      padding: 8px 10px;
      font-size: 16px;
      border: 1px solid #999;
    }

    #search-form button {
      padding: 8px 18px;
      cursor: pointer;
      border: 1px solid #333;
      background: #eee;
      font-size: 15px;
    }

    #search-form button:hover {
      background: #ddd;
    }

    /* CURRENT IMAGE CONTAINER */

    #current-image-container {
      background: black;
      color: white;
      border-left: 5px solid white;
      padding: 5px 15px 20px 15px;
      min-height: 250px;
    }

    #current-image-container h2 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    #current-image-container img {
      display: block;
      width: 100%;
      max-width: 850px;
      height: auto;
      margin-bottom: 20px;
    }

    #current-image-container iframe {
      width: 100%;
      max-width: 850px;
      height: 500px;
      border: none;
      margin-bottom: 20px;
    }

    #current-image-container h3 {
      font-size: 19px;
      margin-bottom: 12px;
    }

    #current-image-container p {
      font-size: 16px;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .loading {
      color: #ddd;
    }

    .error {
      color: #ff6b6b;
      font-weight: bold;
    }

    /* SEARCH HISTORY */

    .history-section {
      margin-top: 25px;
    }

    .history-section h2 {
      margin-bottom: 10px;
      font-size: 24px;
    }

    #search-history {
      padding-left: 25px;
    }

    #search-history li {
      margin: 7px 0;
      cursor: pointer;
      color: blue;
      text-decoration: underline;
      width: fit-content;
    }

    #search-history li:hover {
      color: darkblue;
    }

    @media (max-width: 700px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 28px;
      }

      #search-form {
        flex-direction: column;
        align-items: flex-start;
      }

      #search-input,
      #search-form button {
        width: 100%;
      }

      #current-image-container h2 {
        font-size: 22px;
      }

      #current-image-container iframe {
        height: 300px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>NASA Picture of the Day</h1>

    <!-- Required Form -->
    <form id="search-form">

      <label for="search-input">
        Select a Date:
      </label>

      <input
        type="date"
        id="search-input"
        required
      />

      <button type="submit">
        Search
      </button>

    </form>


    <!-- Required Current Image Container -->
    <section id="current-image-container">

      <p class="loading">
        Loading NASA Picture of the Day...
      </p>

    </section>


    <!-- Search History -->
    <section class="history-section">

      <h2>Previous Searches</h2>

      <ul id="search-history"></ul>

    </section>

  </div>


  <script>

    /*
      Replace DEMO_KEY with your personal NASA API key
      for better reliability.
    */

    const API_KEY = "DEMO_KEY";

    const API_URL =
      "https://api.nasa.gov/planetary/apod";


    const searchForm =
      document.getElementById(
        "search-form"
      );

    const searchInput =
      document.getElementById(
        "search-input"
      );

    const currentImageContainer =
      document.getElementById(
        "current-image-container"
      );

    const searchHistory =
      document.getElementById(
        "search-history"
      );


    // Prevent future dates

    const currentDate =
      new Date()
        .toISOString()
        .split("T")[0];

    searchInput.max =
      currentDate;


    // --------------------------------
    // Fetch NASA API data
    // --------------------------------

    async function fetchNASAImage(date) {

      const url =
        `${API_URL}?api_key=${API_KEY}&date=${date}`;

      const response =
        await fetch(url);


      if (!response.ok) {

        throw new Error(
          "Unable to fetch NASA data."
        );

      }


      return await response.json();

    }


    // --------------------------------
    // Display NASA data
    // --------------------------------

    function displayImage(data) {

      currentImageContainer.innerHTML =
        "";


      // Picture On YYYY-MM-DD

      const heading =
        document.createElement("h2");

      heading.textContent =
        `Picture On ${data.date}`;


      let media;


      // NASA APOD can return image/video

      if (data.media_type === "video") {

        media =
          document.createElement(
            "iframe"
          );

        media.src =
          data.url;

        media.title =
          data.title || "NASA Video";

        media.allowFullscreen =
          true;

      }
      else {

        media =
          document.createElement(
            "img"
          );

        media.src =
          data.hdurl ||
          data.url;

        media.alt =
          data.title ||
          "NASA Picture of the Day";

      }


      // Image title

      const title =
        document.createElement(
          "h3"
        );

      title.textContent =
        data.title ||
        "NASA Picture";


      // Explanation

      const explanation =
        document.createElement(
          "p"
        );

      explanation.textContent =
        data.explanation ||
        "No explanation available.";


      // Append elements

      currentImageContainer
        .appendChild(
          heading
        );

      currentImageContainer
        .appendChild(
          media
        );

      currentImageContainer
        .appendChild(
          title
        );

      currentImageContainer
        .appendChild(
          explanation
        );

    }


    // --------------------------------
    // Error Display
    // --------------------------------

    function showError(message) {

      currentImageContainer
        .innerHTML = `
          <p class="error">
            ${message}
          </p>
        `;

    }


    // --------------------------------
    // REQUIRED FUNCTION
    // getCurrentImageOfTheDay()
    // --------------------------------

    async function getCurrentImageOfTheDay() {

      const today =
        new Date()
          .toISOString()
          .split("T")[0];


      currentImageContainer
        .innerHTML = `
          <p class="loading">
            Loading today's NASA Picture...
          </p>
        `;


      try {

        const data =
          await fetchNASAImage(
            today
          );


        displayImage(
          data
        );

      }
      catch (error) {

        console.error(
          error
        );


        showError(
          "Failed to load today's NASA Picture of the Day."
        );

      }

    }


    // --------------------------------
    // REQUIRED FUNCTION
    // getImageOfTheDay()
    // --------------------------------

    async function getImageOfTheDay(date) {

      if (!date) {

        showError(
          "Please select a date."
        );

        return;

      }


      currentImageContainer
        .innerHTML = `
          <p class="loading">
            Loading image for ${date}...
          </p>
        `;


      try {

        const data =
          await fetchNASAImage(
            date
          );


        // Display image

        displayImage(
          data
        );


        // Save date in localStorage

        saveSearch(
          date
        );


        // Update search history

        addSearchToHistory();

      }
      catch (error) {

        console.error(
          error
        );


        showError(
          "Failed to fetch NASA data for the selected date."
        );

      }

    }


    // --------------------------------
    // REQUIRED FUNCTION
    // saveSearch()
    // --------------------------------

    function saveSearch(date) {

      let searches =
        JSON.parse(
          localStorage.getItem(
            "searches"
          )
        ) || [];


      // Avoid duplicate dates

      if (!searches.includes(date)) {

        searches.push(
          date
        );

      }


      localStorage.setItem(
        "searches",
        JSON.stringify(
          searches
        )
      );

    }


    // --------------------------------
    // REQUIRED FUNCTION
    // addSearchToHistory()
    // --------------------------------

    function addSearchToHistory() {

      const searches =
        JSON.parse(
          localStorage.getItem(
            "searches"
          )
        ) || [];


      searchHistory.innerHTML =
        "";


      if (searches.length === 0) {

        const li =
          document.createElement(
            "li"
          );

        li.textContent =
          "No previous searches";

        li.style.color =
          "#777";

        li.style.cursor =
          "default";

        li.style.textDecoration =
          "none";


        searchHistory
          .appendChild(
            li
          );


        return;

      }


      searches.forEach(
        function(date) {

          const li =
            document.createElement(
              "li"
            );


          li.textContent =
            date;


          /*
            Clicking a history date
            fetches NASA data again
          */

          li.addEventListener(
            "click",
            async function() {

              searchInput.value =
                date;


              currentImageContainer
                .innerHTML = `
                  <p class="loading">
                    Loading image for ${date}...
                  </p>
                `;


              try {

                const data =
                  await fetchNASAImage(
                    date
                  );


                displayImage(
                  data
                );


                // Scroll to result

                currentImageContainer
                  .scrollIntoView({
                    behavior:
                      "smooth"
                  });

              }
              catch (error) {

                console.error(
                  error
                );


                showError(
                  "Unable to fetch data for this search history date."
                );

              }

            }
          );


          searchHistory
            .appendChild(
              li
            );

        }
      );

    }


    // --------------------------------
    // FORM SUBMIT
    // --------------------------------

    searchForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const selectedDate =
          searchInput.value;


        getImageOfTheDay(
          selectedDate
        );

      }
    );


    // --------------------------------
    // PAGE LOAD
    // --------------------------------

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        // Display saved history

        addSearchToHistory();


        // Display today's NASA APOD

        getCurrentImageOfTheDay();

      }
    );

  </script>

</body>
</html>
